<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command Palette — Subtle UI Motion</title>
  <!--
    PATTERN: Command Palette (Cmd+K / Ctrl+K)
    A fast, keyboard-first modal overlay for jumping to actions, pages, or settings.
    - Motion: Crisp 150ms cubic-bezier(0.16, 1, 0.3, 1) entrance (opacity + 98%->100% scale
      + -4px->0 translateY) so it feels instantaneous rather than theatrical.
    - Interaction: Live fuzzy subsequence filtering, ArrowUp/ArrowDown/Home/End navigation,
      Enter to execute, Esc or backdrop click to dismiss, and focus restoration.
    - Adapting: Replace the `COMMANDS` array with your app's routes/actions, and wire
      `executeCommand(cmd)` to your router or action dispatcher.
  -->
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-subtle: #f4f4f5;
      --border: #e4e4e7;
      --border-strong: #d4d4d8;
      --text: #18181b;
      --text-muted: #71717a;
      --accent: #18181b;
      --accent-fg: #ffffff;
      --highlight-bg: #f4f4f5;
      --backdrop: rgba(9, 9, 11, 0.35);
      --shadow: 0 20px 50px -12px rgba(9, 9, 11, 0.18), 0 0 0 1px rgba(9, 9, 11, 0.06);
      --radius: 12px;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --surface: #18181b;
        --surface-subtle: #27272a;
        --border: #27272a;
        --border-strong: #3f3f46;
        --text: #fafafa;
        --text-muted: #a1a1aa;
        --accent: #fafafa;
        --accent-fg: #09090b;
        --highlight-bg: #27272a;
        --backdrop: rgba(0, 0, 0, 0.6);
        --shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .demo-shell {
      width: 100%;
      max-width: 480px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .demo-label {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
    }

    .trigger-btn {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-width: 260px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: border-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
    }

    .trigger-btn:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }

    .trigger-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .trigger-left {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .kbd {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 5px;
    }

    .last-action {
      min-height: 20px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .last-action strong {
      color: var(--text);
      font-weight: 500;
    }

    /* Backdrop & Modal */
    .cmd-backdrop {
      position: fixed;
      inset: 0;
      background: var(--backdrop);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(48px, 14vh, 140px) 16px 24px;
      z-index: 50;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 150ms var(--ease-out-expo), visibility 150ms linear;
    }

    .cmd-backdrop[data-open="true"] {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .cmd-dialog {
      width: 100%;
      max-width: 540px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transform: translateY(-4px) scale(0.98);
      opacity: 0;
      transition: transform 150ms var(--ease-out-expo), opacity 150ms var(--ease-out-expo);
    }

    .cmd-backdrop[data-open="true"] .cmd-dialog {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .cmd-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .cmd-search-icon {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .cmd-input {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      outline: none;
    }

    .cmd-input::placeholder {
      color: var(--text-muted);
    }

    .cmd-list {
      max-height: 320px;
      overflow-y: auto;
      padding: 6px;
      margin: 0;
      list-style: none;
    }

    .cmd-group-label {
      padding: 8px 10px 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .cmd-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 13.5px;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      transition: background-color 80ms ease;
    }

    .cmd-option[aria-selected="true"] {
      background: var(--highlight-bg);
    }

    .cmd-option-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .cmd-option-icon {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .cmd-option[aria-selected="true"] .cmd-option-icon {
      color: var(--text);
    }

    .cmd-option-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cmd-option-title mark {
      background: transparent;
      color: var(--text);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .cmd-option-meta {
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .cmd-empty {
      padding: 28px 16px;
      text-align: center;
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .cmd-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface-subtle);
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .cmd-hints {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cmd-hint {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    @media (prefers-reduced-motion: reduce) {
      .trigger-btn,
      .cmd-backdrop,
      .cmd-dialog,
      .cmd-option {
        transition: none !important;
      }
      .cmd-dialog {
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="demo-shell">
    <p class="demo-label">Press <kbd class="kbd" id="shortcut-hint">Ctrl K</kbd> or click below</p>
    <button type="button" class="trigger-btn" id="cmd-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="cmd-dialog">
      <span class="trigger-left">
        <svg class="cmd-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <span>Search commands...</span>
      </span>
      <kbd class="kbd" id="trigger-kbd">Ctrl K</kbd>
    </button>
    <div class="last-action" id="last-action" role="status" aria-live="polite"></div>
  </main>

  <div class="cmd-backdrop" id="cmd-backdrop" data-open="false" aria-hidden="true">
    <div class="cmd-dialog" id="cmd-dialog" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="cmd-input-wrap">
        <svg class="cmd-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input
          type="text"
          class="cmd-input"
          id="cmd-input"
          placeholder="Type a command or search..."
          autocomplete="off"
          spellcheck="false"
          role="combobox"
          aria-expanded="true"
          aria-controls="cmd-list"
          aria-autocomplete="list"
          aria-activedescendant=""
        />
        <kbd class="kbd">Esc</kbd>
      </div>

      <ul class="cmd-list" id="cmd-list" role="listbox" aria-label="Commands"></ul>

      <div class="cmd-footer">
        <div class="cmd-hints">
          <span class="cmd-hint"><kbd class="kbd">↑</kbd><kbd class="kbd">↓</kbd> Navigate</span>
          <span class="cmd-hint"><kbd class="kbd">↵</kbd> Select</span>
        </div>
        <span class="cmd-hint"><kbd class="kbd">Esc</kbd> Close</span>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const COMMANDS = [
        { id: "new-doc", group: "Actions", label: "Create new document", shortcut: "N", icon: "plus" },
        { id: "invite", group: "Actions", label: "Invite team member", shortcut: "I", icon: "user" },
        { id: "export-csv", group: "Actions", label: "Export workspace as CSV", shortcut: "E", icon: "download" },
        { id: "nav-overview", group: "Navigation", label: "Go to Overview", shortcut: "G O", icon: "compass" },
        { id: "nav-billing", group: "Navigation", label: "Go to Billing & Plans", shortcut: "G B", icon: "card" },
        { id: "nav-api", group: "Navigation", label: "Go to API Keys", shortcut: "G A", icon: "key" },
        { id: "nav-audit", group: "Navigation", label: "Go to Audit Logs", shortcut: "G L", icon: "list" },
        { id: "pref-theme", group: "Preferences", label: "Copy current workspace link", shortcut: "⌘ L", icon: "link" },
        { id: "pref-shortcuts", group: "Preferences", label: "View keyboard shortcuts", shortcut: "?", icon: "keyboard" }
      ];

      const ICONS = {
        plus: '<path d="M12 5v14M5 12h14"/>',
        user: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
        download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
        compass: '<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
        card: '<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>',
        key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>',
        list: '<line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/>',
        link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
        keyboard: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="M6 8h.001M10 8h.001M14 8h.001M18 8h.001M8 12h.001M12 12h.001M16 12h.001M7 16h10"/>'
      };

      const isMac = /Mac|iPod|iPhone|iPad/i.test(navigator.platform);
      const shortcutLabel = isMac ? "⌘ K" : "Ctrl K";
      document.getElementById("shortcut-hint").textContent = shortcutLabel;
      document.getElementById("trigger-kbd").textContent = shortcutLabel;

      const trigger = document.getElementById("cmd-trigger");
      const backdrop = document.getElementById("cmd-backdrop");
      const dialog = document.getElementById("cmd-dialog");
      const input = document.getElementById("cmd-input");
      const list = document.getElementById("cmd-list");
      const lastAction = document.getElementById("last-action");

      let isOpen = false;
      let filtered = [];
      let activeIndex = 0;
      let lastFocused = null;

      function fuzzyMatch(query, text) {
        if (!query) return { score: 1, indices: [] };
        const q = query.toLowerCase().trim();
        const t = text.toLowerCase();
        const directIdx = t.indexOf(q);
        if (directIdx !== -1) {
          const indices = Array.from({ length: q.length }, (_, i) => directIdx + i);
          return { score: 100 - directIdx, indices };
        }
        let qi = 0;
        const indices = [];
        for (let ti = 0; ti < t.length && qi < q.length; ti++) {
          if (t[ti] === q[qi]) {
            indices.push(ti);
            qi++;
          }
        }
        if (qi !== q.length) return null;
        const spread = indices[indices.length - 1] - indices[0];
        return { score: Math.max(1, 50 - spread), indices };
      }

      function highlightText(text, indices) {
        if (!indices || indices.length === 0) return escapeHtml(text);
        const set = new Set(indices);
        let out = "";
        let inMark = false;
        for (let i = 0; i < text.length; i++) {
          const matched = set.has(i);
          if (matched && !inMark) {
            out += "<mark>";
            inMark = true;
          } else if (!matched && inMark) {
            out += "</mark>";
            inMark = false;
          }
          out += escapeHtml(text[i]);
        }
        if (inMark) out += "</mark>";
        return out;
      }

      function escapeHtml(str) {
        return str.replace(/[&<>"']/g, (ch) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[ch]);
      }

      function renderList() {
        const query = input.value;
        const scored = [];
        for (const cmd of COMMANDS) {
          const match = fuzzyMatch(query, cmd.label);
          if (match) scored.push({ cmd, match });
        }
        if (query.trim()) {
          scored.sort((a, b) => b.match.score - a.match.score);
        }

        filtered = scored;
        if (activeIndex >= filtered.length) activeIndex = Math.max(0, filtered.length - 1);

        if (filtered.length === 0) {
          list.innerHTML = `<li class="cmd-empty" role="presentation">No commands found for "${escapeHtml(query)}"</li>`;
          input.setAttribute("aria-activedescendant", "");
          return;
        }

        let html = "";
        let lastGroup = null;

        filtered.forEach((item, idx) => {
          if (!query.trim() && item.cmd.group !== lastGroup) {
            lastGroup = item.cmd.group;
            html += `<li class="cmd-group-label" role="presentation">${escapeHtml(lastGroup)}</li>`;
          }
          const selected = idx === activeIndex;
          const optionId = `cmd-opt-${item.cmd.id}`;
          html += `
            <li
              class="cmd-option"
              id="${optionId}"
              role="option"
              aria-selected="${selected}"
              data-index="${idx}"
            >
              <span class="cmd-option-left">
                <svg class="cmd-option-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  ${ICONS[item.cmd.icon] || ""}
                </svg>
                <span class="cmd-option-title">${highlightText(item.cmd.label, item.match.indices)}</span>
              </span>
              <span class="cmd-option-meta">${escapeHtml(item.cmd.shortcut)}</span>
            </li>
          `;
        });

        list.innerHTML = html;
        updateActiveDescendant();
      }

      function updateActiveDescendant() {
        const current = filtered[activeIndex];
        if (!current) {
          input.setAttribute("aria-activedescendant", "");
          return;
        }
        const optId = `cmd-opt-${current.cmd.id}`;
        input.setAttribute("aria-activedescendant", optId);
        const options = list.querySelectorAll(".cmd-option");
        options.forEach((el) => {
          const isSel = Number(el.dataset.index) === activeIndex;
          el.setAttribute("aria-selected", String(isSel));
          if (isSel) el.scrollIntoView({ block: "nearest" });
        });
      }

      function openPalette() {
        if (isOpen) return;
        isOpen = true;
        lastFocused = document.activeElement;
        input.value = "";
        activeIndex = 0;
        renderList();
        backdrop.setAttribute("data-open", "true");
        backdrop.setAttribute("aria-hidden", "false");
        trigger.setAttribute("aria-expanded", "true");
        requestAnimationFrame(() => input.focus());
      }

      function closePalette() {
        if (!isOpen) return;
        isOpen = false;
        backdrop.setAttribute("data-open", "false");
        backdrop.setAttribute("aria-hidden", "true");
        trigger.setAttribute("aria-expanded", "false");
        if (lastFocused && typeof lastFocused.focus === "function") {
          lastFocused.focus();
        }
      }

      function executeCommand(index) {
        const entry = filtered[index];
        if (!entry) return;
        lastAction.innerHTML = `Executed: <strong>${escapeHtml(entry.cmd.label)}</strong>`;
        closePalette();
      }

      trigger.addEventListener("click", openPalette);

      backdrop.addEventListener("mousedown", (e) => {
        if (e.target === backdrop) closePalette();
      });

      input.addEventListener("input", () => {
        activeIndex = 0;
        renderList();
      });

      list.addEventListener("mousemove", (e) => {
        const opt = e.target.closest(".cmd-option");
        if (!opt) return;
        const idx = Number(opt.dataset.index);
        if (idx !== activeIndex) {
          activeIndex = idx;
          updateActiveDescendant();
        }
      });

      list.addEventListener("click", (e) => {
        const opt = e.target.closest(".cmd-option");
        if (!opt) return;
        executeCommand(Number(opt.dataset.index));
      });

      document.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          isOpen ? closePalette() : openPalette();
          return;
        }
        if (!isOpen) return;

        if (e.key === "Escape") {
          e.preventDefault();
          closePalette();
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          if (filtered.length > 0) {
            activeIndex = (activeIndex + 1) % filtered.length;
            updateActiveDescendant();
          }
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (filtered.length > 0) {
            activeIndex = (activeIndex - 1 + filtered.length) % filtered.length;
            updateActiveDescendant();
          }
        } else if (e.key === "Home") {
          e.preventDefault();
          activeIndex = 0;
          updateActiveDescendant();
        } else if (e.key === "End") {
          e.preventDefault();
          activeIndex = Math.max(0, filtered.length - 1);
          updateActiveDescendant();
        } else if (e.key === "Enter") {
          e.preventDefault();
          executeCommand(activeIndex);
        } else if (e.key === "Tab") {
          // Keep focus inside the command palette input while open
          e.preventDefault();
          input.focus();
        }
      });
    })();
  </script>
</body>
</html>
