<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toast Notification Stack — Subtle UI Motion</title>
  <!--
    PATTERN: Stacked Toast Notifications (Sonner-style)
    Non-intrusive feedback toasts that stack with subtle depth at rest and fan out on hover.
    - Motion: Stacked cards use CSS transforms (`translateY` + `scale` based on `--index`)
      with a smooth 240ms cubic-bezier(0.22, 1, 0.36, 1) transition. Hovering or focusing
      the region expands `--gap` offsets cleanly. Pointer-drag swipe dismisses horizontally.
    - Accessibility: Uses an aria-live="polite" region, keyboard-focusable dismiss/action
      buttons, and pauses auto-dismiss timers while hovered or focused.
    - Adapting: Call `toast({ type, title, description, actionLabel, onAction })` anywhere.
  -->
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-subtle: #f4f4f5;
      --border: #e4e4e7;
      --text: #18181b;
      --text-muted: #71717a;
      --shadow: 0 10px 30px -10px rgba(9, 9, 11, 0.14), 0 0 0 1px rgba(9, 9, 11, 0.06);
      --success: #16a34a;
      --info: #2563eb;
      --warning: #d97706;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --surface: #18181b;
        --surface-subtle: #27272a;
        --border: #27272a;
        --text: #fafafa;
        --text-muted: #a1a1aa;
        --shadow: 0 14px 36px -10px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08);
        --success: #22c55e;
        --info: #60a5fa;
        --warning: #fbbf24;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .controls h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .controls p {
      margin: 0;
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }

    .btn {
      padding: 8px 14px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease;
    }

    .btn:hover {
      background: var(--surface-subtle);
    }

    .btn:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }

    /* Toast Stack Region */
    .toast-viewport {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: min(360px, calc(100vw - 40px));
      z-index: 60;
      pointer-events: none;
    }

    .toast-stack {
      position: relative;
      width: 100%;
      height: 72px;
      pointer-events: auto;
      transition: height 240ms var(--ease);
    }

    .toast {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 13px 14px;
      background: var(--surface);
      border-radius: 11px;
      box-shadow: var(--shadow);
      user-select: none;
      touch-action: pan-y;
      cursor: grab;
      transform-origin: bottom center;
      /* Stacked state by default */
      transform: translate3d(var(--swipe-x, 0px), calc(var(--index, 0) * -11px), 0)
        scale(calc(1 - var(--index, 0) * 0.05));
      opacity: calc(1 - var(--index, 0) * 0.18);
      z-index: calc(100 - var(--index, 0));
      transition: transform 240ms var(--ease), opacity 220ms var(--ease);
    }

    .toast[data-dragging="true"] {
      cursor: grabbing;
      transition: none;
    }

    .toast[data-hidden="true"] {
      opacity: 0;
      pointer-events: none;
      transform: translate3d(0, -24px, 0) scale(0.86);
    }

    .toast[data-entering="true"] {
      opacity: 0;
      transform: translate3d(0, 16px, 0) scale(0.96);
    }

    .toast[data-leaving="true"] {
      opacity: 0;
      pointer-events: none;
      transform: translate3d(var(--leave-x, 0px), 12px, 0) scale(0.95);
    }

    /* Expanded state on hover or focus */
    .toast-stack[data-expanded="true"] .toast:not([data-leaving="true"]):not([data-hidden="true"]) {
      transform: translate3d(var(--swipe-x, 0px), calc(var(--expanded-y, 0px) * -1), 0) scale(1);
      opacity: 1;
    }

    .toast-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      margin-top: 6px;
      flex-shrink: 0;
      background: var(--text-muted);
    }

    .toast[data-type="success"] .toast-dot { background: var(--success); }
    .toast[data-type="info"] .toast-dot { background: var(--info); }
    .toast[data-type="warning"] .toast-dot { background: var(--warning); }

    .toast-body {
      flex: 1;
      min-width: 0;
    }

    .toast-title {
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.35;
    }

    .toast-desc {
      margin-top: 2px;
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .toast-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .toast-action-btn {
      padding: 4px 9px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }

    .toast-close {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: background-color 120ms ease, color 120ms ease;
    }

    .toast-close:hover {
      background: var(--surface-subtle);
      color: var(--text);
    }

    .toast-action-btn:focus-visible,
    .toast-close:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 1px;
    }

    @media (prefers-reduced-motion: reduce) {
      .toast,
      .toast-stack,
      .toast-close,
      .btn {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="controls">
    <h1>Toast Notification Stack</h1>
    <p>Trigger multiple toasts, hover the stack to expand, or swipe right to dismiss.</p>
    <div class="btn-row">
      <button type="button" class="btn" data-trigger="success">Success</button>
      <button type="button" class="btn" data-trigger="info">Info</button>
      <button type="button" class="btn" data-trigger="warning">Warning</button>
      <button type="button" class="btn" data-trigger="undo">With Undo</button>
    </div>
  </main>

  <section class="toast-viewport" aria-label="Notifications">
    <div class="toast-stack" id="toast-stack" role="region" aria-live="polite" aria-label="Notification stack" data-expanded="false"></div>
  </section>

  <script>
    (() => {
      const stack = document.getElementById("toast-stack");
      const MAX_VISIBLE = 3;
      const AUTO_DISMISS_MS = 4500;
      let toasts = [];
      let nextId = 1;
      let isHoveredOrFocused = false;

      const PRESETS = {
        success: {
          type: "success",
          title: "Changes saved",
          description: "Your workspace settings have been updated."
        },
        info: {
          type: "info",
          title: "Export started",
          description: "We will notify you when the CSV is ready."
        },
        warning: {
          type: "warning",
          title: "API rate limit at 85%",
          description: "Consider caching frequent read requests."
        },
        undo: {
          type: "info",
          title: "Item archived",
          description: "Moved Q4 Roadmap to Archive.",
          actionLabel: "Undo"
        }
      };

      function updateLayout() {
        const active = toasts.filter((t) => !t.leaving);
        let expandedOffset = 0;

        active.forEach((item, index) => {
          item.el.style.setProperty("--index", String(index));
          item.el.setAttribute("data-hidden", String(index >= MAX_VISIBLE));

          const height = item.el.offsetHeight || 64;
          item.el.style.setProperty("--expanded-y", `${expandedOffset}px`);
          if (index < MAX_VISIBLE) {
            expandedOffset += height + 10;
          }
        });

        if (active.length === 0) {
          stack.style.height = "0px";
        } else if (isHoveredOrFocused) {
          stack.style.height = `${Math.max(64, expandedOffset - 10)}px`;
        } else {
          const frontHeight = active[0]?.el.offsetHeight || 64;
          stack.style.height = `${frontHeight + Math.min(active.length - 1, MAX_VISIBLE - 1) * 11}px`;
        }
      }

      function dismissToast(id, leaveX = 0) {
        const item = toasts.find((t) => t.id === id);
        if (!item || item.leaving) return;
        item.leaving = true;
        clearTimeout(item.timer);
        if (leaveX) item.el.style.setProperty("--leave-x", `${leaveX}px`);
        item.el.setAttribute("data-leaving", "true");
        updateLayout();

        setTimeout(() => {
          item.el.remove();
          toasts = toasts.filter((t) => t.id !== id);
          updateLayout();
        }, 220);
      }

      function startTimer(item) {
        clearTimeout(item.timer);
        if (isHoveredOrFocused) return;
        item.timer = setTimeout(() => dismissToast(item.id), item.remaining);
        item.startedAt = Date.now();
      }

      function pauseTimers() {
        toasts.forEach((item) => {
          clearTimeout(item.timer);
          if (item.startedAt) {
            item.remaining = Math.max(800, item.remaining - (Date.now() - item.startedAt));
            item.startedAt = null;
          }
        });
      }

      function resumeTimers() {
        toasts.forEach((item) => {
          if (!item.leaving) startTimer(item);
        });
      }

      function createToast(opts) {
        const id = nextId++;
        const el = document.createElement("div");
        el.className = "toast";
        el.setAttribute("role", "status");
        el.setAttribute("data-type", opts.type || "info");
        el.setAttribute("data-entering", "true");

        el.innerHTML = `
          <span class="toast-dot" aria-hidden="true"></span>
          <div class="toast-body">
            <div class="toast-title"></div>
            <div class="toast-desc"></div>
          </div>
          <div class="toast-actions">
            ${opts.actionLabel ? `<button type="button" class="toast-action-btn"></button>` : ""}
            <button type="button" class="toast-close" aria-label="Dismiss notification">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M18 6 6 18M6 6l12 12"/>
              </svg>
            </button>
          </div>
        `;

        el.querySelector(".toast-title").textContent = opts.title;
        el.querySelector(".toast-desc").textContent = opts.description;

        if (opts.actionLabel) {
          const actionBtn = el.querySelector(".toast-action-btn");
          actionBtn.textContent = opts.actionLabel;
          actionBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            dismissToast(id);
            createToast({
              type: "success",
              title: "Action undone",
              description: "Q4 Roadmap was restored."
            });
          });
        }

        el.querySelector(".toast-close").addEventListener("click", (e) => {
          e.stopPropagation();
          dismissToast(id);
        });

        // Pointer swipe-to-dismiss
        let startX = 0;
        let currentX = 0;
        let dragging = false;

        el.addEventListener("pointerdown", (e) => {
          if (e.target.closest("button")) return;
          dragging = true;
          startX = e.clientX;
          currentX = 0;
          el.setAttribute("data-dragging", "true");
          el.setPointerCapture(e.pointerId);
        });

        el.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          const dx = e.clientX - startX;
          currentX = dx < 0 ? dx * 0.25 : dx; // Slight resistance swiping left
          el.style.setProperty("--swipe-x", `${currentX}px`);
          el.style.opacity = String(Math.max(0.2, 1 - Math.abs(currentX) / 220));
        });

        const endDrag = () => {
          if (!dragging) return;
          dragging = false;
          el.removeAttribute("data-dragging");
          if (currentX > 85) {
            dismissToast(id, currentX + 80);
          } else {
            el.style.setProperty("--swipe-x", "0px");
            el.style.opacity = "";
          }
        };

        el.addEventListener("pointerup", endDrag);
        el.addEventListener("pointercancel", endDrag);

        const item = { id, el, remaining: AUTO_DISMISS_MS, timer: null, startedAt: null, leaving: false };
        toasts.unshift(item);
        stack.prepend(el);

        updateLayout();
        requestAnimationFrame(() => {
          el.removeAttribute("data-entering");
          updateLayout();
        });

        startTimer(item);
      }

      stack.addEventListener("mouseenter", () => {
        isHoveredOrFocused = true;
        stack.setAttribute("data-expanded", "true");
        pauseTimers();
        updateLayout();
      });

      stack.addEventListener("mouseleave", () => {
        if (!stack.contains(document.activeElement)) {
          isHoveredOrFocused = false;
          stack.setAttribute("data-expanded", "false");
          resumeTimers();
          updateLayout();
        }
      });

      stack.addEventListener("focusin", () => {
        isHoveredOrFocused = true;
        stack.setAttribute("data-expanded", "true");
        pauseTimers();
        updateLayout();
      });

      stack.addEventListener("focusout", (e) => {
        if (!stack.contains(e.relatedTarget) && !stack.matches(":hover")) {
          isHoveredOrFocused = false;
          stack.setAttribute("data-expanded", "false");
          resumeTimers();
          updateLayout();
        }
      });

      document.querySelectorAll("[data-trigger]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const preset = PRESETS[btn.dataset.trigger];
          if (preset) createToast(preset);
        });
      });

      // Seed one initial toast so the stack is immediately visible
      createToast(PRESETS.info);
    })();
  </script>
</body>
</html>
