<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drawer &amp; Bottom Sheet — Subtle UI Motion</title>
  <!--
    PATTERN: Vaul-style Bottom Sheet & Background Scale-Down
    A tactile bottom sheet (with drag-handle swipe-to-dismiss) that subtly scales down
    the underlying page wrapper to establish spatial depth.
    - Motion: Sheet slides up via `translate3d(0, 100%, 0)` -> `translate3d(0, 0, 0)`
      over 300ms cubic-bezier(0.32, 0.72, 0, 1), while `[data-shell]` scales to 0.96
      with rounded corners. Pointer drag tracks vertical delta with upward rubber-banding.
    - Accessibility: `role="dialog"`, `aria-modal="true"`, Escape & backdrop dismiss,
      focus trap inside the sheet, and focus restoration on close.
    - Adapting: Place your app root inside `.page-shell` and populate `.sheet-body`.
  -->
  <style>
    :root {
      --bg-outer: #09090b;
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-subtle: #f4f4f5;
      --border: #e4e4e7;
      --text: #18181b;
      --text-muted: #71717a;
      --accent: #18181b;
      --accent-fg: #ffffff;
      --handle: #d4d4d8;
      --backdrop: rgba(9, 9, 11, 0.4);
      --ease-vaul: cubic-bezier(0.32, 0.72, 0, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-outer: #000000;
        --bg: #09090b;
        --surface: #18181b;
        --surface-subtle: #27272a;
        --border: #27272a;
        --text: #fafafa;
        --text-muted: #a1a1aa;
        --accent: #fafafa;
        --accent-fg: #09090b;
        --handle: #3f3f46;
        --backdrop: rgba(0, 0, 0, 0.65);
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg-outer);
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .page-shell {
      min-height: 100vh;
      background: var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
      transform-origin: top center;
      transition: transform 300ms var(--ease-vaul), border-radius 300ms var(--ease-vaul);
      will-change: transform;
    }

    .page-shell[data-scaled="true"] {
      transform: scale(0.96) translateY(8px);
      border-radius: 14px;
      overflow: hidden;
    }

    .hero {
      max-width: 440px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .hero h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    .hero p {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--text-muted);
    }

    .open-btn {
      padding: 10px 18px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--accent-fg);
      background: var(--accent);
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      transition: opacity 140ms ease;
    }

    .open-btn:hover {
      opacity: 0.9;
    }

    .open-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Backdrop & Sheet */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: var(--backdrop);
      backdrop-filter: blur(3px);
      z-index: 50;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 280ms var(--ease-vaul), visibility 280ms linear;
    }

    .sheet-backdrop[data-open="true"] {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      margin: 0 auto;
      width: 100%;
      max-width: 540px;
      max-height: 85vh;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -16px 48px rgba(0, 0, 0, 0.16);
      z-index: 60;
      display: flex;
      flex-direction: column;
      transform: translate3d(0, 100%, 0);
      visibility: hidden;
      transition: transform 300ms var(--ease-vaul), visibility 300ms linear;
      will-change: transform;
    }

    .sheet[data-open="true"] {
      transform: translate3d(0, var(--drag-y, 0px), 0);
      visibility: visible;
    }

    .sheet[data-dragging="true"] {
      transition: none;
    }

    .sheet-handle-area {
      padding: 12px 16px 6px;
      display: flex;
      justify-content: center;
      cursor: grab;
      touch-action: none;
    }

    .sheet-handle-area:active {
      cursor: grabbing;
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 999px;
      background: var(--handle);
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 20px 14px;
      border-bottom: 1px solid var(--border);
    }

    .sheet-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }

    .sheet-close {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }

    .sheet-close:hover {
      background: var(--surface-subtle);
      color: var(--text);
    }

    .sheet-close:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .sheet-body {
      padding: 18px 20px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sheet-desc {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--text-muted);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12.5px;
      font-weight: 500;
    }

    .field input {
      padding: 9px 11px;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .field input:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }

    .sheet-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-secondary {
      padding: 8px 14px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-primary {
      padding: 8px 14px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--accent-fg);
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      .page-shell,
      .sheet-backdrop,
      .sheet,
      .open-btn {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell" id="page-shell" data-scaled="false">
    <main class="hero">
      <h1>Bottom Sheet Drawer</h1>
      <p>Opens with a subtle background scale-down, frosted backdrop, and drag-handle swipe-to-dismiss.</p>
      <button type="button" class="open-btn" id="open-sheet" aria-haspopup="dialog" aria-expanded="false" aria-controls="sheet">
        Open Drawer
      </button>
    </main>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" data-open="false" aria-hidden="true"></div>

  <section
    class="sheet"
    id="sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="sheet-title"
    data-open="false"
    aria-hidden="true"
  >
    <div class="sheet-handle-area" id="sheet-handle" title="Drag down to close">
      <div class="sheet-handle" aria-hidden="true"></div>
    </div>

    <div class="sheet-header">
      <h2 class="sheet-title" id="sheet-title">Create API Token</h2>
      <button type="button" class="sheet-close" id="close-sheet" aria-label="Close drawer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <form class="sheet-body" id="sheet-form">
      <p class="sheet-desc">
        Generate a scoped token for CI/CD deployments or local development. Drag the handle downward or press Escape to close.
      </p>
      <div class="field">
        <label for="token-name">Token label</label>
        <input id="token-name" type="text" value="Production Deploy" />
      </div>
      <div class="sheet-footer">
        <button type="button" class="btn-secondary" id="cancel-sheet">Cancel</button>
        <button type="submit" class="btn-primary">Generate Token</button>
      </div>
    </form>
  </section>

  <script>
    (() => {
      const shell = document.getElementById("page-shell");
      const openBtn = document.getElementById("open-sheet");
      const backdrop = document.getElementById("sheet-backdrop");
      const sheet = document.getElementById("sheet");
      const handle = document.getElementById("sheet-handle");
      const closeBtn = document.getElementById("close-sheet");
      const cancelBtn = document.getElementById("cancel-sheet");
      const form = document.getElementById("sheet-form");

      let isOpen = false;
      let lastFocused = null;

      function getFocusable() {
        return Array.from(
          sheet.querySelectorAll('button, input, select, textarea, [href], [tabindex]:not([tabindex="-1"])')
        ).filter((el) => !el.disabled);
      }

      function openSheet() {
        if (isOpen) return;
        isOpen = true;
        lastFocused = document.activeElement;
        sheet.style.setProperty("--drag-y", "0px");
        shell.setAttribute("data-scaled", "true");
        backdrop.setAttribute("data-open", "true");
        backdrop.setAttribute("aria-hidden", "false");
        sheet.setAttribute("data-open", "true");
        sheet.setAttribute("aria-hidden", "false");
        openBtn.setAttribute("aria-expanded", "true");
        requestAnimationFrame(() => {
          const focusables = getFocusable();
          if (focusables[0]) focusables[0].focus();
        });
      }

      function closeSheet() {
        if (!isOpen) return;
        isOpen = false;
        sheet.style.setProperty("--drag-y", "0px");
        shell.setAttribute("data-scaled", "false");
        backdrop.setAttribute("data-open", "false");
        backdrop.setAttribute("aria-hidden", "true");
        sheet.setAttribute("data-open", "false");
        sheet.setAttribute("aria-hidden", "true");
        openBtn.setAttribute("aria-expanded", "false");
        if (lastFocused && typeof lastFocused.focus === "function") {
          lastFocused.focus();
        }
      }

      openBtn.addEventListener("click", openSheet);
      closeBtn.addEventListener("click", closeSheet);
      cancelBtn.addEventListener("click", closeSheet);
      backdrop.addEventListener("click", closeSheet);
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        closeSheet();
      });

      document.addEventListener("keydown", (e) => {
        if (!isOpen) return;
        if (e.key === "Escape") {
          e.preventDefault();
          closeSheet();
        } else if (e.key === "Tab") {
          const focusables = getFocusable();
          if (focusables.length === 0) return;
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      });

      // Pointer drag-to-close on handle
      let dragging = false;
      let startY = 0;
      let deltaY = 0;

      handle.addEventListener("pointerdown", (e) => {
        if (!isOpen) return;
        dragging = true;
        startY = e.clientY;
        deltaY = 0;
        sheet.setAttribute("data-dragging", "true");
        handle.setPointerCapture(e.pointerId);
      });

      handle.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const raw = e.clientY - startY;
        // Rubber-band resistance when dragging upward past 0
        deltaY = raw < 0 ? raw * 0.2 : raw;
        sheet.style.setProperty("--drag-y", `${deltaY}px`);
      });

      const endDrag = () => {
        if (!dragging) return;
        dragging = false;
        sheet.removeAttribute("data-dragging");
        const threshold = Math.min(140, sheet.offsetHeight * 0.35);
        if (deltaY > threshold) {
          closeSheet();
        } else {
          sheet.style.setProperty("--drag-y", "0px");
        }
      };

      handle.addEventListener("pointerup", endDrag);
      handle.addEventListener("pointercancel", endDrag);
    })();
  </script>
</body>
</html>
